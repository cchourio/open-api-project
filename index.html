<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Explorer – Open-Meteo</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <header>
    <h1>Weather Explorer</h1>
    <p>Powered by <a href="https://open-meteo.com" target="_blank">Open-Meteo</a></p>
  </header>

  <nav>
    <button id="btn-temperature" class="nav-btn active">Temperature</button>
    <button id="btn-conditions" class="nav-btn">Conditions</button>
  </nav>

  <main>
    <div id="location-bar">
      <label for="city-select">City:</label>
      <select id="city-select">
        <option value="40.71,-74.01">New York, USA</option>
        <option value="51.51,-0.13">London, UK</option>
        <option value="48.85,2.35">Paris, France</option>
        <option value="35.68,139.69">Tokyo, Japan</option>
        <option value="19.43,-99.13">Mexico City, Mexico</option>
      </select>
    </div>

    <section id="content-area">
      <p class="loading">Loading weather data…</p>
    </section>
  </main>

  <footer>
    <p>Data provided by <a href="https://open-meteo.com" target="_blank">Open-Meteo API</a> – free &amp; open-source.</p>
  </footer>

  <script src="index.js"></script>
</body>
</html>
